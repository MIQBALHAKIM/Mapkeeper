name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run tests and staleness checks
        run: npm run check
      - name: Validate example artifacts
        run: |
          node scripts/validate-graph.mjs tests/fixtures/graph.valid.json
          node scripts/validate-context.mjs tests/fixtures/context.valid.md
          node scripts/check-managed-blocks.mjs tests/fixtures