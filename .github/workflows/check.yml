name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run router tests and guide check
        run: npm run check
      - name: Check fixture status
        run: node scripts/mapkeeper.mjs status --dir tests/fixtures/router --no-write --check