schema_version: "1.0"

extension:
  id: "mapkeeper"
  name: "Mapkeeper"
  version: "2.0.0"
  description: "Build and maintain a validated project map: knowledge graph, coverage ledger, Obsidian vault, and architecture exports, with spec-kit traceability."
  author: "Mapkeeper contributors"
  license: "Apache-2.0"

requires:
  speckit_version: ">=0.1.0"

provides:
  commands:
    - name: "speckit.mapkeeper.init"
      file: "commands/init.md"
      description: "Create or rebuild the project map for this repository"
    - name: "speckit.mapkeeper.sync"
      file: "commands/sync.md"
      description: "Incrementally sync the project map after spec or code changes"
    - name: "speckit.mapkeeper.audit"
      file: "commands/audit.md"
      description: "Validate the map and report coverage and traceability gaps"

hooks:
  after_tasks:
    command: "speckit.mapkeeper.sync"
    optional: true
    prompt: "Sync the project map with the new tasks?"
    description: "Keep requirement-to-task traceability current after task generation"
  after_implement:
    command: "speckit.mapkeeper.sync"
    optional: true
    prompt: "Sync the project map after implementation?"
    description: "Refresh code and requirement traceability after implementation"

tags:
  - "project-map"
  - "architecture"
  - "graph"
  - "obsidian"
  - "traceability"